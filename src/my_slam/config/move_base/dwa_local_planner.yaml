DWAPlannerROS:
  # 로봇 최대 선속도 (m/s)
  # throttle=1.0일 때 1.0 m/s 로 가정
  max_vel_trans: 0.4       # 최대 속도 제한
  min_vel_trans: 0.05        # |velocity|가 0.1 m/s 이하로 내려가지 않도록

  max_vel_x: 0.5
  min_vel_x: -0.3
  
  max_vel_y: 0.0
  min_vel_y: 0.0

  # 회전(제자리 turn) 속도
  max_rot_theta: 1.5        # 회전 속도 제한
  min_rot_theta: 0.3

  # 가속도
  acc_lim_x: 1.0          # m/s^2
  dec_lim_x: 1.0
  acc_lim_theta: 3.0      # rad/s^2
  dec_lim_theta: 3.0

  acc_lim_y: 0.0

  # 시뮬레이션 시간 (DWA가 여러 시뮬레이션 트젝터리를 평가)
  sim_time: 2.5
  vx_samples: 20
  vy_samples: 0
  vtheta_samples: 40

  # 목표 도달시 오차 허용 범위
  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.17
  latch_xy_goal_tolerance: false
  
  # 복구 동작 조정
  oscillation_reset_dist: 0.1  # 진동 감지 거리
  oscillation_timeout: 5.0      # 진동 감지 시간

  # 로컬 경로 평가
  path_distance_bias: 40.0
  goal_distance_bias: 20.0
  occdist_scale: 0.5
  forward_point_distance: 0.325
  stop_time_buffer: 0.1

  # 장애물 앞에서 감속할 것인지
  scaling_speed: 0.25
  max_scaling_factor: 0.8

  # differential_drive처럼 y축 이동(측면이동)은 불가능
  # ackerman형이라도 move_base 상에서는 diff drive 비슷하게 취급
  holonomic_robot: false   # 차동 구동 설정
