# 로봇의 물리적 특성
footprint: [[-0.15, -0.06], [-0.15, 0.06], [0.15, 0.06], [0.15, -0.06]]
robot_radius: 0.20

# 장애물 감지 및 회피 설정
obstacle_layer:
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: laser_frame
    data_type: LaserScan
    topic: scan
    marking: true
    clearing: true
    inf_is_valid: true

# 장애물 팽창 설정
inflation_layer:
  inflation_radius: 0.50
  cost_scaling_factor: 2.0