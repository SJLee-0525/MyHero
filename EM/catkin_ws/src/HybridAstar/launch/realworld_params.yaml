global_costmap:
  global_frame: "map"
  robot_base_frame: "base_footprint"
  update_frequency: 1.0
  publish_frequency: 0.5
  transform_tolerance: 0.5
  static_map: false           # Hector SLAM이 지속적으로 맵 업데이트
  rolling_window: true        # 실제 환경에서도 rolling window 사용
  width: 30.0                 # 필요에 따라 로봇 주변 환경에 맞게 수정
  height: 30.0                # 필요에 따라 수정
  resolution: 0.05
  track_unknown_space: true
  unknown_cost_value: -1
  always_send_full_costmap: true

  footprint: [[-0.2, -0.15], [-0.2, 0.15], [0.2, 0.15], [0.2, -0.15]]  # 로봇 실제 크기
  footprint_padding: 0.05             # 장애물과의 최소 여유(패딩)

