# global_costmap_params.yaml

global_costmap:
  global_frame: "map"
  robot_base_frame: "base_footprint"
  update_frequency: 2.0
  publish_frequency: 2.0
  transform_tolerance: 0.5
  static_map: false              # Hector SLAM이 지속적으로 맵 업데이트
  rolling_window: true           # 글로벌도 rolling_window 사용
  width: 50.0
  height: 50.0
  resolution: 0.05
