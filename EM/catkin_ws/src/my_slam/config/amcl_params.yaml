# amcl_params.yaml
use_sim_time: true

# Particle filter 기본 설정
min_particles: 500
max_particles: 2000

# KLD 샘플링 관련 (입자 수를 동적으로 조절)
kld_err: 0.05
kld_z: 0.99

# Laser 모델 설정 (likelihood_field 모델 사용)
laser_model_type: "likelihood_field"
laser_min_range: 0.3      # 최소 센서 측정 범위 (LiDAR 특성에 맞게)
laser_max_range: 12.0     # 최대 센서 측정 범위
laser_z_hit: 0.95         # 측정 값이 정확할 확률 (0~1 사이)
laser_sigma_hit: 0.2      # 측정 값의 표준편차
laser_z_rand: 0.05        # 랜덤 잡음에 해당하는 비율

# 업데이트 임계값 (로봇이 충분히 움직였을 때만 업데이트)
update_min_d: 0.2         # 최소 평행 이동 거리 (미터)
update_min_a: 0.2         # 최소 회전 각도 (라디안)

# 프레임 설정
global_frame_id: "map"            # 전역 프레임 (맵 서버에서 로드한 static map)
robot_base_frame_id: "base_footprint"  # 로봇의 기준 프레임 (costmap 및 TF와 일치)
# odom 프레임이 없는 경우, odom_frame_id도 로봇 베이스 프레임으로 지정할 수 있음.
odom_frame_id: "base_footprint"

# 재샘플링 주기 (몇 번의 업데이트마다 재샘플링을 수행할 것인지)
resample_interval: 1

# TF 관련 허용 오차 (초)
transform_tolerance: 0.5

# (옵션) 초기 위치 불확실성 (필요시 설정)
