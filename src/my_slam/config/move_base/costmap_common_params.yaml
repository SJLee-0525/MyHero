# costmap_common_params.yaml

robot_base_frame: "base_footprint"   # Hector SLAM에서 사용하는 로봇 베이스 프레임
# (base_link로 쓰고 있다면 "base_link"로 통일)

global_frame: "map"                  # SLAM에서 제공하는 최상위 프레임

transform_tolerance: 0.5             # TF 지연 허용치 (초)

# 로봇의 실제 크기가 30cm x 16cm
# => 여유를 두어 footprint를 설정 (단위: m)
footprint: [[0.15, 0.08], [0.15, -0.08], [-0.15, -0.08], [-0.15, 0.08]]

# 만약 원형 로봇처럼 처리하고 싶다면 대신
# robot_radius: 0.12
# (위 footprint와 robot_radius는 동시에 쓰지 않음)

footprint_padding: 0.01             # 장애물과의 최소 여유(패딩)
obstacle_range: 2.5                 # 장애물로 인식할 최대거리 (LiDAR 12m라도 실제 2.5m까지만 costmap 처리)
raytrace_range: 3.0                 # 레이 트레이싱으로 free space로 인식할 범위
min_obstacle_height: 0.0
max_obstacle_height: 2.0

# 주행 환경이나 LiDAR 설치 높이에 따라 조정 가능

# 센서 업데이트 관련 (라이다만 사용)
observation_sources: "laser_scan"
laser_scan:
  data_type: LaserScan
  topic: scan             # 실제 LiDAR 토픽 이름
  marking: true
  clearing: true
  sensor_frame: laser_frame
